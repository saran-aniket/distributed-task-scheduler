spring:
  application:
    name: scheduler-service

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
  flyway:
    locations: classpath:db/migration

  data:
    redis:
      host: ${SPRING_DATA_REDIS_HOST}
      port: ${SPRING_DATA_REDIS_PORT}

  redisson-lock-prefix: "distributed_lock_"

eureka:
  client:
    serviceUrl:
      defaultZone: ${EUREKA_URI:http://localhost:8761/eureka/}

management:
  health:
    db:
      enabled: true
    redis:
      enabled: true

scheduler:
  poll-interval-ms: 5000
  jitter-ms: 2000
  dispatch-interval-ms: 5000
  batch-size: 10
  wait-time-ms: 2000
  lease-time-ms: 30000
  execution-timeout-ms: 75000
  misfire-check-interval-ms: 10000
  node-id: ${NODE_ID:node-0}

---
#Test data setup
spring:
  config:
    activate:
      on-profile: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    # Appends the test-data folder so it runs alongside standard migrations
    locations:
      - classpath:db/migration
      - classpath:db/test-data
    # Maps Spring properties to Flyway SQL script variables
    placeholders:
      test.user.prefix: "test-user-"