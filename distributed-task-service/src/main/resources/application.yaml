spring:
  application:
    name: distributed-task-scheduler
  profiles:
    active: dev

app:
  jwt:
    secret: ${JWT_SECRET:change-me-please-use-a-long-secret-for-dev}
    expiration-ms: ${JWT_EXPIRATION_MS:300000}
  rate-limit:
    requests-per-minute: ${API_RATE_LIMIT_REQUESTS_PER_MINUTE:100}

management:
  endpoint:
    health:
      show-details: always
      show-components: always
      probes:
        enabled: true
  health:
    db:
      enabled: true
    redis:
      enabled: true
  endpoints:
    web:
      exposure:
        include: health, info
